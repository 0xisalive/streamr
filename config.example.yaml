# streamr configuration
# Copy to config.yaml and fill in. Secrets can alternatively be supplied via
# environment variables (STREAMR_*), which override the file.
#
# Format: one "key: value" per line. Indexers use repeated torznab:/newznab:
# lines with space-separated name=/url=/key=/enabled= fields.

# --- HTTP server ---
addr: ":8080"
# Path to the built frontend (run `make web` or `cd web && npm run build`).
# Leave empty to run the JSON API only (e.g. behind a separate static host).
web_dir: "web/dist"
# Working directory for the subtitle cache and other runtime data.
data_dir: "./data"

# --- Discovery (the Seerr-style search layer) ---
# Free TMDB API key: https://www.themoviedb.org/settings/api
# Env: STREAMR_TMDB_API_KEY
tmdb_api_key: ""

# --- Torrent streaming engine ---
# "embedded" (DEFAULT): a BitTorrent client is built into streamr — nothing to
#   install or configure. It downloads pieces in playback order and supports
#   seek (piece reprioritization). This is the recommended, zero-setup option.
# "qbittorrent": drive an existing qBittorrent WebUI instead (see below).
engine: "embedded"

# Only used when engine == "qbittorrent":
# Enable the WebUI in qBittorrent (Tools > Options > Web UI). streamr adds
# torrents with sequential download so they stream in order.
# Env: STREAMR_QBIT_URL / STREAMR_QBIT_USER / STREAMR_QBIT_PASS
# qbit_url: "http://localhost:8081"
# qbit_user: "admin"
# qbit_pass: "adminadmin"
# qbit's download dir, which must be READABLE by streamr (same host / shared mount):
# qbit_save_dir: "/downloads"

# --- Sources: MAXIMIZE COVERAGE by listing many indexers ---
# RECOMMENDED: run Prowlarr (or Jackett) and point ONE torznab line at it.
# Prowlarr aggregates hundreds of public AND private trackers behind a single
# Torznab endpoint, so one line gives you the widest net. You can add more
# lines for redundancy or to split public/private.
#
# Prowlarr exposes a per-app Torznab URL like:
#   http://localhost:9696/<n>/api   (apikey from Prowlarr settings)
torznab: name=prowlarr url=http://localhost:9696/1/api key=PROWLARR_API_KEY enabled=true
# Example of a second, direct Jackett indexer (optional):
# torznab: name=jackett-1337x url=http://localhost:9117/api/v2.0/indexers/1337x/results/torznab key=JACKETT_KEY enabled=false

# Usenet indexers (Newznab) — the biggest win for OBSCURE / OLD content, since
# retention servers keep content alive regardless of popularity (no dead swarm).
# Requires a Usenet provider + indexer subscription. Enable when you have them.
# newznab: name=nzbgeek url=https://api.nzbgeek.info/api key=NEWZNAB_KEY enabled=true

# --- Subtitles ---
# streamr produces subtitles two ways, in this order:
#   1. If OpenSubtitles is configured, fetch a subtitle and ALIGN it to the
#      audio via the tiered pipeline (ffsubsync -> alass -> whisperx).
#   2. Otherwise — or if OpenSubtitles has no result / is rate-limited (the free
#      tier allows only ~20 downloads/day) — GENERATE subtitles directly from
#      the audio with Whisper-on-the-go. This is the quota-free DEFAULT and
#      works even for obscure titles with no existing subtitle.
# Generated/aligned subtitles are cached in SQLite, so the expensive work runs
# once per (release, language).

# OpenSubtitles (optional). Free API key: https://www.opensubtitles.com/consumers
# Env: STREAMR_OPENSUBTITLES_API_KEY
opensubtitles_api_key: ""
opensubtitles_user_agent: "streamr/0.1"

# Whisper-on-the-go generation (DEFAULT ON). Needs a whisper CLI on PATH —
# install ONE of: faster-whisper (recommended, CPU-friendly) or openai-whisper.
#   pip install faster-whisper   # provides `whisper-ctranslate2`
#   pip install -U openai-whisper # provides `whisper`
whisper_gen_enabled: "true"
whisper_model: "base"     # tiny|base|small|medium|large (bigger = better + slower)
whisper_device: "cpu"     # "cuda" if you have an NVIDIA GPU

# Tiered ALIGNER settings (only used when OpenSubtitles supplies a raw subtitle):
# Minimum alignment confidence to ACCEPT a re-synced subtitle. Below this, the
# original is kept unchanged (guards against making a good sub worse).
sub_min_confidence: "0.55"
# WhisperX Tier-3 forced-alignment (opt-in; needs PyTorch, GPU recommended).
# Env: STREAMR_WHISPERX_ENABLED
whisperx_enabled: "false"

# --- Streaming session lifecycle ---
# Idle sessions (and their torrents) are torn down after this many minutes to
# prevent resource leaks. 60 is a sane default.
session_idle_timeout_minutes: "60"
